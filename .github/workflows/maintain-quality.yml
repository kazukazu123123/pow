name: Maintain code quality

on:
  push:
    branches: ['**']
  pull_request:

permissions: {}

jobs:
  ci:
    name: ci
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            binaries.prisma.sh:443
            checkpoint.prisma.io:443
            github.com:443
            nodejs.org:443
            unofficial-builds.nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          # 依存パッケージのビルドに node-gyp が要るため、ここでは install しない
          install: false

      - name: Install node-gyp
        run: pnpm add --global node-gyp@${NODE_GYP_VERSION}
        env:
          # renovate: datasource=npm depName=node-gyp
          NODE_GYP_VERSION: 13.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Check all
        run: pnpm run --aggregate-output "/^(format:check|lint|check:types)$/"
        env:
          FORCE_COLOR: 3
